name: Validate Discord Posts

on:
  # No paths filter: "Discord Post Checks" is a required check on main,
  # so it has to report on every PR or non-channel PRs could never merge.
  pull_request:
  push:
    branches: [main]
    paths:
      - "channels/**"
      - ".github/workflows/validate-posts.yml"
      - ".github/scripts/validate_posts.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-posts:
    name: Discord Post Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Validate markdown, images, and placeholders
        run: python3 .github/scripts/validate_posts.py
